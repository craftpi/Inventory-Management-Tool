name: Supabase Keep Alive
on:
  schedule:
    # Läuft jeden 3. Tag um 00:00 Uhr
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Erlaubt manuelles Starten

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Führe einen Ping auf der Supabase-Datenbank aus
        env:
          # Wir laden die Datenbank-URL aus den sicheren GitHub Secrets
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # psql ist auf 'ubuntu-latest' standardmäßig installiert
        # Wir verbinden uns und führen "SELECT 1;" aus, um Aktivität zu erzeugen
        run: psql "$SUPABASE_DB_URL" -c "SELECT 1;"